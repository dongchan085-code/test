name: Daily HF Papers Newsletter

on:
  schedule:
    # 매일 아침 9시 (한국시간 기준 KST 09:00 -> UTC 00:00) 
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '찾고 싶은 주제 (예: LLM, Vision, RAG 등)'
        required: false
        default: 'LLM'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Generate Newsletter (Run main.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOPIC: ${{ inputs.topic || vars.HF_TOPIC || 'LLM' }}
        run: |
          python main.py
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # index.html이 있는 현재 디렉토리를 업로드합니다.
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
